<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>우주라이크</title>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const type = (params.get("type") || "").toLowerCase();
    const id = params.get("id");

    let deeplink = "wouldulike://";
    if (type === "restaurant" || type === "restaurants") {
      deeplink = id ? `wouldulike://restaurant/${id}` : "wouldulike://restaurant";
    } else if (type === "affiliate") {
      deeplink = "wouldulike://restaurant";
    } else if (type === "tab" && id) {
      deeplink = `wouldulike://tab/${id}`;
    } else if (type === "coupons" || type === "coupon") {
      deeplink = "wouldulike://coupons";
    } else if (type === "main") {
      deeplink = "wouldulike://main";
    } else if (type === "mileage") {
      // 앱이 wouldulike://mileage 를 받게 되면 그때 스킴만 바꾸면 됨
      deeplink = "wouldulike://coupons";
    }

    window.location.href = deeplink;

    setTimeout(() => {
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isIOS) {
        window.location.href =
          "https://apps.apple.com/app/id6740640251";
      } else {
        window.location.href =
          "https://play.google.com/store/apps/details?id=com.coggiri.new1";
      }
    }, 1500);
  </script>
  <p>앱을 여는 중...</p>
</body>
</html>
